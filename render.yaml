# FREE tier: uses Turso cloud database (no disk needed).
# Create a free DB at https://turso.tech then set these in Render dashboard:
#   TURSO_DATABASE_URL  = libsql://your-db.turso.io
#   TURSO_AUTH_TOKEN    = your token
#
# PAID alternative: use plan "starter" + disk block (see DEPLOY.md)

services:
  - type: web
    name: fitness-garage
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Set in Render dashboard after creating Turso database:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
